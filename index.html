<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Postagens Horizontais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="feed">
    <article class="post">
      <img src="https://via.placeholder.com/150" alt="Capa da postagem" class="post-img">
      
      <div class="post-content">
        <h2>Título da Postagem</h2>
        <p>Este é o texto descritivo da postagem. Com o layout em linha, a imagem fica à esquerda, o conteúdo no centro e o botão ajustado.</p>
      </div>

      <button class="post-btn">Saiba Mais</button>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
